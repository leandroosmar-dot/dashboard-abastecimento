<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abastecimento — Frota</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --fundo: #ffffff;
    --painel: #ffffff;
    --linha: #e3e5e8;
    --texto: #111318;
    --texto-fraco: #6b7280;
    --diesel: #d9840f;
    --diesel-2: #b56b0a;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--fundo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  main{ max-width: 1280px; margin: 0 auto; padding: 28px 32px 60px; }

  header{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 18px; }
  header h1{ margin:0; font-size: 2rem; font-weight: 800; }
  header p{ margin: 4px 0 0; color: var(--texto-fraco); font-size: 0.92rem; }
  .btn-imprimir{
    background:#fff; border:1px solid var(--linha); border-radius: 6px;
    padding: 9px 18px; font-size: 0.88rem; cursor:pointer; color: var(--texto);
  }
  .btn-imprimir:hover{ background:#f7f8fa; }

  hr{ border:none; border-top: 2px solid var(--texto); margin: 18px 0 22px; }

  .filtros{
    display:flex; flex-wrap: wrap; gap: 24px; align-items:flex-end; margin-bottom: 24px;
  }
  .filtro{ min-width: 150px; }
  .filtro label{ display:block; font-size: 0.82rem; color: var(--texto-fraco); margin-bottom: 6px; }
  .filtro input, .filtro select{
    width:100%; padding: 9px 10px; border: 1px solid var(--linha); border-radius: 6px;
    font-size: 0.9rem; font-family: inherit; color: var(--texto); background:#fff;
  }
  .filtro input:focus, .filtro select:focus{ outline: 2px solid var(--diesel); outline-offset: 1px; }

  .painel{
    background: var(--painel);
    border: 1px solid var(--linha);
    border-radius: 8px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }

  .metricas{ display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px; margin-bottom: 22px; }
  .metrica{ border: 1px solid var(--linha); border-left: 4px solid var(--diesel); border-radius: 8px; padding: 14px 16px; }
  .metrica .valor{ font-size: 1.6rem; font-weight: 800; color: var(--diesel-2); }
  .metrica .rotulo{ font-size: 0.78rem; color: var(--texto-fraco); margin-top: 4px; }

  .grafico-box{ position: relative; height: 320px; }
  h2{ font-size: 1rem; font-weight: 700; margin: 0 0 16px; }

  table{ width:100%; border-collapse: collapse; font-size: 0.86rem; }
  th, td{ text-align:left; padding: 9px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  th{ color: var(--texto-fraco); font-weight: 600; font-size: 0.78rem; }
  tbody tr:hover{ background: #f7f8fa; }
  .tabela-scroll{ overflow-x:auto; }
  .aviso{ background:#fdf1e0; border:1px solid var(--diesel); color: var(--diesel-2); padding:10px 14px; border-radius:8px; font-size:0.86rem; margin-bottom:20px; }

  @media print{
    .btn-imprimir, .filtros{ display:none; }
  }
</style>
</head>
<body>

<main>
  <header>
    <div>
      <h1>Abastecimento da frota</h1>
      <p id="subtitulo">PortoExpress Logística — carregando dados…</p>
    </div>
    <button class="btn-imprimir" onclick="window.print()">Imprimir</button>
  </header>
  <hr>

  <div class="filtros">
    <div class="filtro">
      <label>De</label>
      <input type="date" id="filtro-de">
    </div>
    <div class="filtro">
      <label>Até</label>
      <input type="date" id="filtro-ate">
    </div>
    <div class="filtro">
      <label>Placa</label>
      <select id="filtro-placa"><option value="">Todas</option></select>
    </div>
    <div class="filtro">
      <label>Posto</label>
      <select id="filtro-posto"><option value="">Todos</option></select>
    </div>
    <div class="filtro">
      <label>Motorista</label>
      <select id="filtro-motorista"><option value="">Todos</option></select>
    </div>
  </div>

  <div id="aviso-vazio" class="aviso" style="display:none">
    Nenhum dado encontrado em <code>base_abastecimentos.csv</code>.
  </div>

  <div class="metricas" id="metricas"></div>

  <div class="painel">
    <h2>Km rodado por placa (por mês)</h2>
    <div class="grafico-box"><canvas id="grafico-km"></canvas></div>
  </div>

  <div class="painel">
    <h2>Média de consumo (km/l) por placa (por mês)</h2>
    <div class="grafico-box"><canvas id="grafico-media"></canvas></div>
  </div>

  <div class="painel">
    <h2>Notas detalhadas</h2>
    <div class="tabela-scroll">
      <table id="tabela">
        <thead>
          <tr>
            <th>Data</th><th>Placa</th><th>Motorista</th><th>Posto</th>
            <th>Combustível</th><th>Litros</th><th>Valor</th><th>Km atual</th>
            <th>Km rodado</th><th>Média</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const CORES = ['#e8a13a','#6fbf8b','#7aa9d9','#d97757','#c98bd9','#e0d15f','#63c9c1'];
let dados = [];
let chartKm, chartMedia;

function corDaPlaca(placa){
  const lista = [...new Set(dados.map(d=>d.placa))].sort();
  return CORES[lista.indexOf(placa) % CORES.length];
}

function formatarNumero(n, casas=0){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', {minimumFractionDigits:casas, maximumFractionDigits:casas});
}

function mesDaLinha(linha){
  const d = new Date(linha.data_emissao);
  if(isNaN(d)) return null;
  return String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

function popularSelects(){
  const placas = [...new Set(dados.map(d=>d.placa).filter(Boolean))].sort();
  const postos = [...new Set(dados.map(d=>d.posto).filter(Boolean))].sort();
  const motoristas = [...new Set(dados.map(d=>d.motorista).filter(Boolean))].sort();

  const selPlaca = document.getElementById('filtro-placa');
  placas.forEach(p=> selPlaca.appendChild(new Option(p, p)));

  const selPosto = document.getElementById('filtro-posto');
  postos.forEach(p=> selPosto.appendChild(new Option(p, p)));

  const selMotorista = document.getElementById('filtro-motorista');
  motoristas.forEach(m=> selMotorista.appendChild(new Option(m, m)));

  // Datas De/Ate: preenche com a faixa real dos dados, por padrao
  const datasValidas = dados.map(d=> new Date(d.data_emissao)).filter(d=>!isNaN(d));
  if(datasValidas.length){
    const min = new Date(Math.min(...datasValidas));
    const max = new Date(Math.max(...datasValidas));
    document.getElementById('filtro-de').value = min.toISOString().slice(0,10);
    document.getElementById('filtro-ate').value = max.toISOString().slice(0,10);
    document.getElementById('subtitulo').textContent =
      `PortoExpress Logística — dados atualizados em ${max.toLocaleDateString('pt-BR')}`;
  }
}

function dadosFiltrados(){
  const de = document.getElementById('filtro-de').value;
  const ate = document.getElementById('filtro-ate').value;
  const placa = document.getElementById('filtro-placa').value;
  const posto = document.getElementById('filtro-posto').value;
  const motorista = document.getElementById('filtro-motorista').value;

  const deData = de ? new Date(de + 'T00:00:00') : null;
  const ateData = ate ? new Date(ate + 'T23:59:59') : null;

  return dados.filter(d=>{
    const data = new Date(d.data_emissao);
    if(isNaN(data)) return false;
    if(deData && data < deData) return false;
    if(ateData && data > ateData) return false;
    if(placa && d.placa !== placa) return false;
    if(posto && d.posto !== posto) return false;
    if(motorista && d.motorista !== motorista) return false;
    return true;
  });
}

function atualizar(){
  const filtrado = dadosFiltrados();

  const totalKm = filtrado.reduce((s,d)=> s + (d.km_rodado||0), 0);
  const totalLitros = filtrado.reduce((s,d)=> s + (d.litros||0), 0);
  const mediaGeral = totalLitros>0 ? totalKm/totalLitros : null;

  document.getElementById('metricas').innerHTML = `
    <div class="metrica"><div class="valor">${filtrado.length}</div><div class="rotulo">Abastecimentos</div></div>
    <div class="metrica"><div class="valor">${formatarNumero(totalKm)}</div><div class="rotulo">Km rodado total</div></div>
    <div class="metrica"><div class="valor">${formatarNumero(totalLitros,1)}</div><div class="rotulo">Litros totais</div></div>
    <div class="metrica"><div class="valor">${mediaGeral? formatarNumero(mediaGeral,2) : '—'}</div><div class="rotulo">Média geral (km/l)</div></div>
  `;

  const grupos = {};
  filtrado.forEach(d=>{
    const mes = mesDaLinha(d);
    if(!mes) return;
    const chave = mes + '||' + d.placa;
    if(!grupos[chave]) grupos[chave] = {mes, placa: d.placa, km:0, litros:0};
    grupos[chave].km += (d.km_rodado||0);
    grupos[chave].litros += (d.litros||0);
  });
  const linhasAgrupadas = Object.values(grupos);
  const meses = [...new Set(linhasAgrupadas.map(l=>l.mes))].sort((a,b)=>{
    const [ma,aa]=a.split('/'); const [mb,ab]=b.split('/');
    return (aa+ma).localeCompare(ab+mb);
  });
  const placas = [...new Set(filtrado.map(d=>d.placa).filter(Boolean))].sort();

  const datasetsKm = placas.map(p=>({
    label: p,
    backgroundColor: corDaPlaca(p),
    data: meses.map(mes=>{
      const item = linhasAgrupadas.find(l=>l.mes===mes && l.placa===p);
      return item ? item.km : 0;
    })
  }));

  const datasetsMedia = placas.map(p=>({
    label: p,
    borderColor: corDaPlaca(p),
    backgroundColor: corDaPlaca(p),
    tension: 0.25,
    data: meses.map(mes=>{
      const item = linhasAgrupadas.find(l=>l.mes===mes && l.placa===p);
      return item && item.litros>0 ? +(item.km/item.litros).toFixed(2) : null;
    })
  }));

  const opcoesComuns = {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ color:'#111318' } } },
    scales:{
      x:{ ticks:{ color:'#6b7280' }, grid:{ color:'#e3e5e8' } },
      y:{ ticks:{ color:'#6b7280' }, grid:{ color:'#e3e5e8' } }
    }
  };

  if(chartKm) chartKm.destroy();
  chartKm = new Chart(document.getElementById('grafico-km'), {
    type:'bar', data:{ labels: meses, datasets: datasetsKm }, options: opcoesComuns
  });

  if(chartMedia) chartMedia.destroy();
  chartMedia = new Chart(document.getElementById('grafico-media'), {
    type:'line', data:{ labels: meses, datasets: datasetsMedia }, options: opcoesComuns
  });

  const tbody = document.querySelector('#tabela tbody');
  tbody.innerHTML = '';
  filtrado
    .slice()
    .sort((a,b)=> new Date(b.data_emissao) - new Date(a.data_emissao))
    .forEach(d=>{
      const tr = document.createElement('tr');
      const data = new Date(d.data_emissao);
      tr.innerHTML = `
        <td>${isNaN(data)?'—':data.toLocaleDateString('pt-BR')}</td>
        <td>${d.placa||'—'}</td>
        <td>${d.motorista||'—'}</td>
        <td>${d.posto||'—'}</td>
        <td>${d.combustivel||'—'}</td>
        <td>${formatarNumero(d.litros,1)}</td>
        <td>R$ ${formatarNumero(d.valor_total,2)}</td>
        <td>${formatarNumero(d.km_atual)}</td>
        <td>${d.km_rodado? formatarNumero(d.km_rodado):'—'}</td>
        <td>${d.media_km_l? formatarNumero(d.media_km_l,2):'—'}</td>
      `;
      tbody.appendChild(tr);
    });
}

['filtro-de','filtro-ate','filtro-placa','filtro-posto','filtro-motorista'].forEach(id=>{
  document.getElementById(id).addEventListener('change', atualizar);
});

Papa.parse('base_abastecimentos.csv?v=' + Date.now(), {
  download: true,
  header: true,
  dynamicTyping: true,
  skipEmptyLines: true,
  complete: function(resultado){
    dados = resultado.data;
    if(!dados.length){
      document.getElementById('aviso-vazio').style.display = 'block';
      return;
    }
    popularSelects();
    atualizar();
  },
  error: function(){
    document.getElementById('aviso-vazio').style.display = 'block';
  }
});
</script>
</body>
</html>
